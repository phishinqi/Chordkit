name: Publish to npm

on:
  push:
    tags:
      - "v*"
  pull_request:
    paths:
      - ".github/workflows/publish.yml"
      - "package.json"
      - "package-lock.json"
      - "src/**"
      - "tsup.config.ts"
  workflow_dispatch:

jobs:
  verify-package:
    name: Verify package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Verify npm package contents
        run: npm pack --dry-run

  publish:
    name: Publish to npm
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify-package
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Upgrade npm for trusted publishing
        run: npm install --global npm@latest

      - name: Publish
        run: npm publish --access public